<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Geminic Supply</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Desain Khusus Halaman Keranjang & Checkout */
        .cart-page {
            padding: 120px 50px 50px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .cart-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .cart-items {
            flex: 2;
            min-width: 300px;
        }

        .checkout-section {
            flex: 1;
            min-width: 300px;
            background: #f9f9f9;
            padding: 30px;
            border: 1px solid #eee;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 20px 10px;
            /* Ditambahkan padding sedikit agar tulisan tidak mepet ke kiri */
            border-bottom: 1px solid #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: red;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
            padding: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: sans-serif;
        }

        .checkout-btn {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background: #333;
        }

        #total-price {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="menu-icon" id="menu-btn">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
        <div style="color: white; font-weight: 900; letter-spacing: 5px; cursor:pointer;"
            onclick="location.href='geminicsupply.html'">GEMINIC SUPPLY</div>
        <div class="nav-right">
            <div class="keranjang" style="cursor: pointer;" onclick="location.href='cart.html'"><i
                    class="fas fa-shopping-bag"></i></div>
        </div>
    </nav>

    <div id="side-menu" class="side-menu">
        <a href="geminicsupply.html">HOME</a>
        <a href="collection.html">COLLECTION</a>
        <a href="shop.html">SHOP</a>
        <a href="aboutus.html">ABOUT</a>
    </div>

    <main class="cart-page">
        <h2 style="letter-spacing: 5px; font-weight: 900;">SHOPPING BAG</h2>

        <div class="cart-container">
            <div class="cart-items" id="cart-items-list">
            </div>

            <div class="checkout-section">
                <h3 style="letter-spacing: 2px; margin-bottom: 20px;">ORDER SUMMARY</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 30px;">
                    <span>TOTAL:</span>
                    <span id="total-price">IDR 0</span>
                </div>

                <h3 style="letter-spacing: 2px; margin-bottom: 15px; font-size: 14px;">SHIPPING DETAILS</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>NAMA PENERIMA</label>
                        <input type="text" id="buyer-name" required>
                    </div>
                    <div class="form-group">
                        <label>NOMOR WHATSAPP</label>
                        <input type="tel" id="buyer-phone" placeholder="Contoh: 0812345678" required>
                    </div>
                    <div class="form-group">
                        <label>ALAMAT LENGKAP</label>
                        <textarea id="buyer-address" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="checkout-btn">PLACE ORDER (VIA WHATSAPP)</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Logika render halaman keranjang belanja
        let localCart = JSON.parse(localStorage.getItem('geminic_cart')) || [];

        function displayCart() {
            const listElement = document.getElementById('cart-items-list');
            const totalElement = document.getElementById('total-price');
            listElement.innerHTML = "";
            let totalPrice = 0;

            if (localCart.length === 0) {
                listElement.innerHTML = "<p>Keranjang belanja kamu kosong.</p>";
                totalElement.innerText = "IDR 0";
                return;
            }

            localCart.forEach((item, index) => {
                totalPrice += (item.price * item.quantity);
                // GAMBAR SUDAH DIHAPUS TOTAL DI BAGIAN INI
                listElement.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <p>IDR ${item.price.toLocaleString('id-ID')} x ${item.quantity}</p>
                            <button class="remove-btn" onclick="removeItem(${index})">Hapus</button>
                        </div>
                    </div>
                `;
            });

            totalElement.innerText = "IDR " + totalPrice.toLocaleString('id-ID');
        }

        function removeItem(index) {
            localCart.splice(index, 1);
            localStorage.setItem('geminic_cart', JSON.stringify(localCart));
            displayCart();
        }

        // Integrasi Checkout Otomatis Langsung Kirim ke WhatsApp Toko Kamu
        document.getElementById('checkout-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('buyer-name').value;
            const phone = document.getElementById('buyer-phone').value.replace(/\D/g, '');
            const address = document.getElementById('buyer-address').value;

            let itemText = "";
            let grandTotal = 0;
            localCart.forEach(item => {
                itemText += `- ${item.name} (${item.quantity}x)\n`;
                grandTotal += (item.price * item.quantity);
            });

            // Ganti nomor di bawah ini dengan nomor WhatsApp tokomu (gunakan kode negara, misal 62)
            const whatsappNumber = "628135226411";

            const message = `Halo Geminic Supply, saya mau order:\n\n${itemText}\nTotal: IDR ${grandTotal.toLocaleString('id-ID')}\n\n*Data Pengiriman:*\nNama: ${name}\nNo. HP: ${phone}\nAlamat: ${address}`;

            const encodeMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeMessage}`;

            // Kosongkan keranjang setelah checkout berhasil
            localStorage.removeItem('geminic_cart');

            // Alihkan pembeli langsung ke WhatsApp
            window.open(whatsappUrl, '_blank');
        });

        document.addEventListener('DOMContentLoaded', displayCart);
    </script>
    <script src="script.js"></script>
</body>

</html>
